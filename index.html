<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mensch Cycling Coach</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 10px; }
        .rider-card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; overflow: hidden; }
        .header { background: #1a1a1a; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .tabs { display: flex; background: #eee; gap: 2px; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; border: none; background: #ddd; font-weight: bold; }
        .tab.active { background: white; border-bottom: 3px solid #e74c3c; }
        .content { padding: 15px; display: none; }
        .content.active { display: block; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-group { margin-bottom: 10px; }
        label { display: block; font-size: 11px; color: #666; margin-bottom: 3px; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input:disabled { background: #f9f9f9; color: #888; border: 1px dashed #ccc; }
        .save-btn { background: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        #loading { text-align: center; padding: 50px; font-weight: bold; }
    </style>
</head>
<body>

<div id="app">
    <div id="loading">Henter rytterdata fra Google Sheets...</div>
</div>

<script>
    const WEB_APP_URL = 'INDSET_DIN_APPS_SCRIPT_URL_HER'; 

    async function loadData() {
        try {
            const response = await fetch(WEB_APP_URL);
            const data = await response.json();
            renderApp(data);
        } catch (error) {
            document.getElementById('loading').innerText = "Fejl ved indlæsning. Tjek din Web App URL.";
        }
    }

    function renderApp(riders) {
        const app = document.getElementById('app');
        app.innerHTML = '';

        riders.forEach(rider => {
            const card = document.createElement('div');
            card.className = 'rider-card';
            card.innerHTML = `
                <div class="header">
                    <strong>${rider.name}</strong>
                    <button class="save-btn" onclick="saveRider('${rider.id}')">Gem</button>
                </div>
                <div class="tabs">
                    <div class="tab active" onclick="showTab(this, 'tal', '${rider.id}')">Tal</div>
                    <div class="tab" onclick="showTab(this, 'profil', '${rider.id}')">Profil</div>
                    <div class="tab" onclick="showTab(this, 'saeson', '${rider.id}')">Sæson</div>
                    <div class="tab" onclick="showTab(this, 'hist', '${rider.id}')">Historisk</div>
                </div>
                
                <div id="tal-${rider.id}" class="content active">
                    <div class="grid">
                        <div class="input-group"><label>Status A9 (Formel)</label><input type="text" disabled value="${rider.cells.A9}"></div>
                        <div class="input-group"><label>Status B9 (Formel)</label><input type="text" disabled value="${rider.cells.B9}"></div>
                        <div class="input-group"><label>Status C9 (Formel)</label><input type="text" disabled value="${rider.cells.C9}"></div>
                        <div class="input-group"><label>Basis B7</label><input type="text" id="B7-${rider.id}" value="${rider.cells.B7}"></div>
                        <div class="input-group"><label>Data B14</label><input type="text" id="B14-${rider.id}" value="${rider.cells.B14}"></div>
                        <div class="input-group"><label>Data B15</label><input type="text" id="B15-${rider.id}" value="${rider.cells.B15}"></div>
                        <div class="input-group"><label>Data B16</label><input type="text" id="B16-${rider.id}" value="${rider.cells.B16}"></div>
                    </div>
                </div>

                <div id="profil-${rider.id}" class="content">
                    <label>Profil Information</label>
                    <textarea rows="4">${rider.cells.profil}</textarea>
                </div>

                <div id="saeson-${rider.id}" class="content">
                    <p style="font-size: 13px; color: #666;">Sæsonplanlægning (Data fra række 25-35)</p>
                </div>

                <div id="hist-${rider.id}" class="content">
                    <label>Historik (Række 39-40)</label>
                    <textarea id="hist-${rider.id}-text" rows="4">${rider.cells.historik}</textarea>
                </div>
            `;
            app.appendChild(card);
        });
    }

    function showTab(tabEl, tabName, id) {
        const card = tabEl.closest('.rider-card');
        card.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        card.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        tabEl.classList.add('active');
        card.querySelector(`#${tabName}-${id}`).classList.add('active');
    }

    async function saveRider(id) {
        const btn = event.target;
        btn.innerText = "Gemmer...";
        
        const payload = {
            id: id,
            B7: document.getElementById(`B7-${id}`).value,
            B14: document.getElementById(`B14-${id}`).value,
            B15: document.getElementById(`B15-${id}`).value,
            B16: document.getElementById(`B16-${id}`).value,
            historik: document.getElementById(`hist-${id}-text`).value
        };

        await fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        
        btn.innerText = "Gemt!";
        setTimeout(() => btn.innerText = "Gem", 2000);
    }

    loadData();
</script>
</body>
</html>
