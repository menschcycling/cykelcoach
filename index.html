
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mensch Cycling">
<title>Mensch Cycling</title>
<style>
  :root {
    --blaa: #185FA5;
    --blaa-lys: #E6F1FB;
    --blaa-mid: #378ADD;
    --blaa-mork: #0C447C;
    --graa-lys: #f0f0ee;
    --graa-mid: #e4e4e1;
    --graa-mork: #5F5E5A;
    --bg: #f5f5f3;
    --kort: #ffffff;
    --tekst: #1a1a18;
    --tekst2: #5F5E5A;
    --kant: rgba(0,0,0,0.1);
    --radius: 12px;
    --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18; --kort: #2a2a28; --tekst: #e8e6de; --tekst2: #9c9a92;
      --kant: rgba(255,255,255,0.1); --blaa-lys: #0C447C;
      --graa-lys: #2e2e2c; --graa-mid: #383836;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--tekst); font-size: 16px; }

  .topbar { background: var(--kort); border-bottom: 0.5px solid var(--kant); padding: 12px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; }
  .topbar-logo { height: 32px; width: auto; display: block; }
  .topbar-titel { font-size: 17px; font-weight: 600; flex: 1; }
  .tilbage-knap { font-size: 15px; color: var(--blaa-mid); cursor: pointer; padding: 4px 0; white-space: nowrap; }

  .soeg-wrapper { padding: 12px 16px; }
  .soeg-felt { width: 100%; padding: 10px 14px; border-radius: var(--radius-sm); border: 0.5px solid var(--kant); background: var(--kort); color: var(--tekst); font-size: 16px; outline: none; }
  .soeg-felt:focus { border-color: var(--blaa-mid); }

  .sektion-label { font-size: 12px; font-weight: 600; color: var(--tekst2); text-transform: uppercase; letter-spacing: 0.06em; padding: 10px 0 6px; }

  .rytter-liste { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px; }
  .rytter-kort { background: var(--kort); border: 0.5px solid var(--kant); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: opacity 0.1s; }
  .rytter-kort:active { opacity: 0.7; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--graa-mid); color: var(--tekst); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; flex-shrink: 0; }
  .rytter-info { flex: 1; min-width: 0; }
  .rytter-navn { font-size: 16px; font-weight: 600; color: var(--tekst); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rytter-sub { font-size: 14px; color: var(--tekst2); margin-top: 2px; }
  .rytter-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
  .badge-A     { background: #1a1a18; color: #ffffff; }
  .badge-B     { background: #2d6a2d; color: #ffffff; }
  .badge-U19   { background: #1a1a18; color: #ffffff; }
  .badge-U17   { background: #e07b00; color: #1a1a18; }
  .badge-Master{ background: #d4b800; color: #1a1a18; }
  .badge-Motion{ background: #a8d8ea; color: #1a1a18; }
  .badge-anden { background: var(--graa-mid); color: var(--tekst); }
  .chevron { color: var(--tekst2); font-size: 18px; margin-left: 2px; }

  .detalje { display: none; }
  .profil-header { background: var(--kort); border-bottom: 0.5px solid var(--kant); padding: 16px; display: flex; align-items: center; gap: 14px; }
  .profil-avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--graa-mid); color: var(--tekst); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 20px; flex-shrink: 0; }
  .profil-navn { font-size: 20px; font-weight: 700; }
  .profil-sub { font-size: 15px; color: var(--tekst2); margin-top: 3px; }

  .tab-bar { display: flex; gap: 5px; padding: 12px 16px 4px; }
  .tab { flex: 1; padding: 8px 2px; text-align: center; font-size: 13px; font-weight: 500; border-radius: var(--radius-sm); border: 0.5px solid var(--kant); cursor: pointer; color: var(--tekst2); background: transparent; transition: all 0.15s; }
  .tab.aktiv { background: var(--graa-mid); color: var(--tekst); border-color: transparent; font-weight: 600; }

  .tab-indhold { display: none; padding: 12px 16px 32px; }
  .tab-indhold.aktiv { display: block; }

  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .metric-kort { background: var(--graa-lys); border-radius: var(--radius-sm); padding: 12px 14px; }
  .metric-label { font-size: 13px; color: var(--tekst2); margin-bottom: 4px; font-weight: 500; }
  .metric-vaerdi { font-size: 18px; font-weight: 600; color: var(--tekst); }
  .metric-enhed { font-size: 13px; color: var(--tekst2); font-weight: 400; }

  .data-kort { background: var(--kort); border: 0.5px solid var(--kant); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
  .data-raekke { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; border-bottom: 0.5px solid var(--kant); gap: 12px; }
  .data-raekke:last-child { border-bottom: none; padding-bottom: 0; }
  .data-noegle { font-size: 16px; color: var(--tekst2); flex-shrink: 0; }
  .data-val { font-size: 16px; color: var(--tekst); text-align: right; line-height: 1.5; display: flex; align-items: center; gap: 6px; justify-content: flex-end; }

  .note-boks { background: var(--graa-lys); border-radius: var(--radius-sm); padding: 13px 15px; font-size: 16px; color: var(--tekst); line-height: 1.7; margin-bottom: 10px; }

  /* CP TEST TABEL */
  .test-tabel { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
  .test-tabel th { font-size: 12px; font-weight: 600; color: var(--tekst2); text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 10px; text-align: left; background: var(--graa-mid); }
  .test-tabel th:last-child { text-align: right; }
  .test-tabel td { font-size: 16px; padding: 10px 10px; border-bottom: 0.5px solid var(--kant); color: var(--tekst); }
  .test-tabel td:last-child { text-align: right; }
  .test-tabel tr:last-child td { border-bottom: none; }
  .test-tabel-wrap { background: var(--kort); border: 0.5px solid var(--kant); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
  .rediger-ikon { font-size: 15px; color: var(--blaa-mid); cursor: pointer; padding: 2px 4px; flex-shrink: 0; }

  /* HISTORISK */
  .historisk-boks { background: var(--graa-lys); border-radius: var(--radius-sm); padding: 13px 15px; font-size: 16px; color: var(--tekst); line-height: 1.7; min-height: 120px; }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: flex-end; }
  .modal-overlay.aktiv { display: flex; }
  .modal-boks { background: var(--kort); border-radius: 16px 16px 0 0; padding: 20px 16px 32px; width: 100%; }
  .modal-titel { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .modal-textarea { width: 100%; padding: 12px; border: 0.5px solid var(--kant); border-radius: var(--radius-sm); background: var(--bg); color: var(--tekst); font-size: 16px; font-family: inherit; line-height: 1.6; resize: vertical; min-height: 100px; outline: none; }
  .modal-textarea:focus { border-color: var(--blaa-mid); }
  .modal-knapper { display: flex; gap: 10px; margin-top: 12px; }
  .modal-gem { flex: 1; padding: 13px; background: #1a1a18; color: white; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; cursor: pointer; }
  .modal-gem:active { opacity: 0.8; }
  .modal-annuller { flex: 1; padding: 13px; background: transparent; color: var(--tekst2); border: 0.5px solid var(--kant); border-radius: var(--radius-sm); font-size: 15px; cursor: pointer; }

  .status { text-align: center; padding: 48px 16px; color: var(--tekst2); }
  .spinner { width: 32px; height: 32px; border: 2.5px solid var(--kant); border-top-color: var(--blaa-mid); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fejl-boks { background: var(--graa-lys); border-radius: var(--radius); padding: 16px; margin: 16px; color: var(--tekst); font-size: 15px; line-height: 1.6; border: 0.5px solid var(--kant); }

  .indst-boks { background: var(--kort); border: 0.5px solid var(--kant); border-radius: var(--radius); padding: 16px; margin: 16px; }
  .indst-label { font-size: 14px; color: var(--tekst2); margin-bottom: 6px; }
  .indst-input { width: 100%; padding: 10px 12px; border: 0.5px solid var(--kant); border-radius: var(--radius-sm); background: var(--bg); color: var(--tekst); font-size: 14px; font-family: monospace; }
  .indst-gem { width: 100%; margin-top: 10px; padding: 13px; background: #1a1a18; color: white; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; cursor: pointer; }
  .indst-vejl { font-size: 13px; color: var(--tekst2); margin-top: 8px; line-height: 1.5; }
  .ingen-ryttere { text-align: center; padding: 32px 16px; color: var(--tekst2); font-size: 15px; }
</style>
</head>
<body>

<div id="liste-view">
  <div class="topbar">
    <img src="logo.png" class="topbar-logo" alt="Mensch Cycling">
    <div class="topbar-titel">Mensch Cycling</div>
    <div style="font-size:13px;color:var(--tekst2);cursor:pointer;" onclick="visIndstillinger()">⚙️</div>
  </div>
  <div id="liste-indhold">
    <div class="status"><div class="spinner"></div><div>Henter ryttere...</div></div>
  </div>
</div>

<div id="detalje-view" class="detalje">
  <div class="topbar">
    <div class="tilbage-knap" onclick="visListe()">‹ Tilbage</div>
    <div class="topbar-titel" id="detalje-topbar-navn"></div>
  </div>
  <div class="profil-header">
    <div class="profil-avatar" id="profil-avatar"></div>
    <div>
      <div class="profil-navn" id="profil-navn"></div>
      <div class="profil-sub" id="profil-sub"></div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab aktiv"  onclick="skiftTab('tal',this)">Tal</div>
    <div class="tab" onclick="skiftTab('profil',this)">Profil</div>
    <div class="tab" onclick="skiftTab('saeson',this)">Sæson</div>
    <div class="tab" onclick="skiftTab('historisk',this)">Historisk</div>
  </div>
  <div id="tab-tal"       class="tab-indhold aktiv"></div>
  <div id="tab-profil"    class="tab-indhold"></div>
  <div id="tab-saeson"    class="tab-indhold"></div>
  <div id="tab-historisk" class="tab-indhold"></div>
</div>

<div id="indst-view" style="display:none;">
  <div class="topbar">
    <div class="tilbage-knap" onclick="visListe()">‹ Tilbage</div>
    <div class="topbar-titel">Indstillinger</div>
  </div>
  <div class="indst-boks">
    <div class="indst-label">Apps Script URL</div>
    <input class="indst-input" id="api-url-input" type="url" placeholder="https://script.google.com/macros/s/.../exec">
    <button class="indst-gem" onclick="gemUrl()">Gem og hent ryttere</button>
    <div class="indst-vejl">Indsæt URL'en fra dit Google Apps Script deployment her.</div>
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="lukkModal(event)">
  <div class="modal-boks">
    <div class="modal-titel" id="modal-titel">Rediger</div>
    <textarea class="modal-textarea" id="modal-tekst"></textarea>
    <div class="modal-knapper">
      <button class="modal-annuller" onclick="skjulModal()">Annuller</button>
      <button class="modal-gem" onclick="gemFelt()">Gem i Google Sheet</button>
    </div>
  </div>
</div>

<script>
var API_URL = localStorage.getItem("cykelcoach_api_url") || "";
var rytterListe = [];
var aktivSheetId = null;
var aktivCelleRef = null;
var aktivTab = "tal";

window.onload = function() {
  if (API_URL) hentRytterliste(); else visIndstillinger();
};

// ── NAVIGATION ────────────────────────────────────────────
function visListe() {
  document.getElementById("liste-view").style.display = "";
  document.getElementById("detalje-view").style.display = "none";
  document.getElementById("detalje-view").className = "detalje";
  document.getElementById("indst-view").style.display = "none";
}
function visDetalje() {
  document.getElementById("liste-view").style.display = "none";
  document.getElementById("indst-view").style.display = "none";
  document.getElementById("detalje-view").style.display = "";
  document.getElementById("detalje-view").className = "";
}
function visIndstillinger() {
  document.getElementById("liste-view").style.display = "none";
  document.getElementById("detalje-view").style.display = "none";
  document.getElementById("indst-view").style.display = "";
  document.getElementById("api-url-input").value = localStorage.getItem("cykelcoach_api_url") || "";
}
function gemUrl() {
  var url = document.getElementById("api-url-input").value.trim();
  if (!url) return;
  localStorage.setItem("cykelcoach_api_url", url);
  API_URL = url;
  visListe();
  hentRytterliste();
}

function skiftTab(navn, el) {
  aktivTab = navn;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("aktiv"));
  document.querySelectorAll(".tab-indhold").forEach(t => t.classList.remove("aktiv"));
  el.classList.add("aktiv");
  document.getElementById("tab-" + navn).classList.add("aktiv");
}
function genopretTab(navn) {
  var navne = ["tal","profil","saeson","historisk"];
  var tabs = document.querySelectorAll(".tab");
  document.querySelectorAll(".tab-indhold").forEach(t => t.classList.remove("aktiv"));
  tabs.forEach(t => t.classList.remove("aktiv"));
  var idx = navne.indexOf(navn);
  if (idx >= 0) {
    tabs[idx].classList.add("aktiv");
    document.getElementById("tab-" + navn).classList.add("aktiv");
  }
}

// ── DATA ──────────────────────────────────────────────────
function hentRytterliste() {
  document.getElementById("liste-indhold").innerHTML =
    '<div class="status"><div class="spinner"></div><div>Henter ryttere...</div></div>';
  fetch(API_URL + "?handling=liste")
    .then(r => r.json())
    .then(data => {
      if (data.fejl) throw new Error(data.fejl);
      rytterListe = data.ryttere || [];
      visRytterliste(rytterListe);
    })
    .catch(err => {
      document.getElementById("liste-indhold").innerHTML =
        '<div class="fejl-boks">Kunne ikke hente data.<br><br><strong>Fejl:</strong> ' + err.message + '<br><br>Tjek din Apps Script URL under ⚙️</div>';
    });
}

function hentRytterData(id, bevarTab) {
  aktivSheetId = id;
  if (!bevarTab) aktivTab = "tal";
  visDetalje();
  if (!bevarTab) {
    document.querySelectorAll(".tab").forEach((t,i) => t.classList.toggle("aktiv", i===0));
    document.querySelectorAll(".tab-indhold").forEach((t,i) => t.classList.toggle("aktiv", i===0));
  }
  fetch(API_URL + "?handling=rytter&id=" + encodeURIComponent(id))
    .then(r => r.json())
    .then(d => {
      if (d.fejl) throw new Error(d.fejl);
      bygTalTab(d);
      bygProfilTab(d);
      bygSaesonTab(d);
      bygHistoriskTab(d);
      document.getElementById("detalje-topbar-navn").textContent = d.navn;
      document.getElementById("profil-avatar").textContent = hentInitialer(d.navn);
      document.getElementById("profil-navn").textContent = d.navn;
      document.getElementById("profil-sub").textContent =
        [d.alder ? d.alder + " år" : "", d.niveau ? "Niveau " + d.niveau : "", d.phenotype].filter(Boolean).join(" · ");
      if (bevarTab) genopretTab(bevarTab);
    })
    .catch(err => {
      document.getElementById("tab-tal").innerHTML = '<div class="fejl-boks">Fejl: ' + err.message + '</div>';
    });
}

// ── BYGG FANER ────────────────────────────────────────────
function bygTalTab(d) {
  var cpVis   = formatCpHel(d.cp);
  var cpKgVis = formatCpKg(d.cpKg);
  var wPrimVis = formatWPrim(d.wPrim);
  document.getElementById("tab-tal").innerHTML =
    sl("Performance") +
    '<div class="metric-grid">' +
      mh("CP", cpVis, "W") + mh("CP relativ", cpKgVis, "W/kg") +
      mh("W'", wPrimVis, "J") + mh("VO2max", d.vo2max, "ml/kg") +
    '</div>' +
    sl("CP test") +
    '<div class="test-tabel-wrap"><table class="test-tabel">' +
      '<thead><tr><th>Tid (s)</th><th>Watt</th><th>Forventet W</th><th>Afv. %</th></tr></thead>' +
      '<tbody>' +
        testRaekke(d.test1tid, d.test1watt, d.test1forventet, d.test1afvigelse, "A14", "B14", 1) +
        testRaekke(d.test2tid, d.test2watt, d.test2forventet, d.test2afvigelse, "A15", "B15", 2) +
        testRaekke(d.test3tid, d.test3watt, d.test3forventet, d.test3afvigelse, "A16", "B16", 3) +
      '</tbody>' +
    '</table></div>' +
    sl("Antropometri") +
    '<div class="data-kort">' +
      dr("Højde",               d.hojde  ? d.hojde  + " cm" : "–", null) +
      dr("Vægt",                d.vaegt  ? d.vaegt  + " kg"  : "–", "B7") +
      dr("Fødselsdato",         d.fodselsdato || "–", null) +
      dr("Volumen sidste sæson", d.volumen || "–", "B22") +
    '</div>';
}

function testRaekke(tid, watt, forventet, afvigelse, tidRef, wattRef, nr) {
  var tidVis  = tid  || "–";
  var wattVis = watt || "–";
  // Forventet watt: vis som heltal
  var forvVis = "–";
  if (forventet) {
    var forvNum = parseFloat(String(forventet).replace(",","."));
    forvVis = isNaN(forvNum) ? forventet : Math.round(forvNum).toString();
  }
  // Afvigelse: rå decimaltal fx -0.002976 → "-0,30%"
  var afvVis = "–";
  if (afvigelse) {
    var afvNum = parseFloat(String(afvigelse).replace(",","."));
    if (!isNaN(afvNum)) {
      // Hvis tallet er meget lille (under 1), er det en andel der skal ganges med 100
      var pct = Math.abs(afvNum) < 1 ? afvNum * 100 : afvNum;
      afvVis = pct.toFixed(2).replace(".", ",") + "%";
    } else {
      afvVis = afvigelse;
    }
  }
  var redigerTid  = '<span class="rediger-ikon" onclick="aabneModal(\'' + tidRef  + '\',\'Tid '  + nr + '\',\'' + (tid||"")  + '\')">✎</span>';
  var redigerWatt = '<span class="rediger-ikon" onclick="aabneModal(\'' + wattRef + '\',\'Watt ' + nr + '\',\'' + (watt||"") + '\')">✎</span>';
  return '<tr>' +
    '<td>' + tidVis  + ' ' + redigerTid  + '</td>' +
    '<td>' + wattVis + ' ' + redigerWatt + '</td>' +
    '<td style="color:var(--tekst2)">' + forvVis + '</td>' +
    '<td style="color:var(--tekst2);text-align:right;">' + afvVis + '</td>' +
    '</tr>';
}

function bygProfilTab(d) {
  document.getElementById("tab-profil").innerHTML =
    sl("Mål")          + nb(d.maal,         "Mål",          "B20") +
    sl("Personlighed") + nb(d.personlighed,  "Personlighed", "B24") +
    sl("Vurdering")    + nb(d.vurdering,     "Vurdering",    "B26") +
    sl("Historik")     + nb(d.historik,      "Historik",     "B21") +
    sl("Ressourcer")   + nb(d.ressourcer,    "Ressourcer",   "B23") +
    sl("Andet")        + nb(d.andet,         "Andet",        "B25");
}

function bygSaesonTab(d) {
  var cpVis   = formatCpHel(d.cpSaeson);
  var cpKgVis = formatCpKg(d.cpKgSaeson);
  var wPrimVis = formatWPrim(d.wPrimSaeson);
  document.getElementById("tab-saeson").innerHTML =
    sl("Mål") + nb(d.maalSaeson, "Mål", "B33") +
    sl("Watttal") +
    '<div class="metric-grid">' +
      mh("CP", cpVis, "W") + mh("CP relativ", cpKgVis, "W/kg") +
      mh("W'", wPrimVis, "J") + mh("Phenotype", d.phenotypeSaeson, "") +
    '</div>' +
    sl("Fysisk indsats") + nb(d.fysiskSaeson,  "Fysisk indsats", "B35") +
    sl("Anden indsats")  + nb(d.andenSaeson,   "Anden indsats",  "B36") +
    sl("Noter")          + nb(d.noterSaeson,   "Noter",          "B34");
}

function bygHistoriskTab(d) {
  var tekst = d.historisk || "–";
  var rediger = '<span class="rediger-ikon" style="float:right;" onclick="aabneModal(\'B40\',\'Historisk\',\'' + (d.historisk||"").replace(/'/g,"\\'").replace(/\n/g,"\\n") + '\')">✎</span>';
  document.getElementById("tab-historisk").innerHTML =
    '<div style="padding: 10px 0 6px;">' + rediger + '</div>' +
    '<div class="historisk-boks">' + tekst.replace(/\n/g,"<br>") + '</div>';
}

// ── HTML HJÆLPERE ─────────────────────────────────────────
function sl(t) { return '<div class="sektion-label">' + t + '</div>'; }

function mh(label, vaerdi, enhed) {
  return '<div class="metric-kort"><div class="metric-label">' + label + '</div>' +
    '<div class="metric-vaerdi">' + (vaerdi || "–") +
    (vaerdi && enhed ? ' <span class="metric-enhed">' + enhed + '</span>' : '') +
    '</div></div>';
}

function dr(noegle, vaerdi, celleRef) {
  var rediger = celleRef
    ? '<span class="rediger-ikon" onclick="aabneModal(\'' + celleRef + '\',\'' + noegle + '\',\'' + vaerdi.replace(/'/g,"\\'") + '\')">✎</span>'
    : '';
  return '<div class="data-raekke"><div class="data-noegle">' + noegle + '</div>' +
    '<div class="data-val">' + vaerdi + rediger + '</div></div>';
}

function nb(tekst, label, celleRef) {
  var rediger = celleRef
    ? '<span class="rediger-ikon" style="float:right;" onclick="aabneModal(\'' + celleRef + '\',\'' + label + '\',\'' + (tekst||"").replace(/'/g,"\\'").replace(/\n/g,"\\n") + '\')">✎</span>'
    : '';
  return '<div class="note-boks">' + rediger + (tekst || "–") + '</div>';
}

// ── NIVEAU BADGE ──────────────────────────────────────────
function niveauBadge(niveau) {
  if (!niveau) return '';
  var n = niveau.trim();
  var klasser = { "A":"badge-A","B":"badge-B","U19":"badge-U19","U17":"badge-U17","Master":"badge-Master","Motion":"badge-Motion" };
  var kl = klasser[n] || "badge-anden";
  return '<span class="badge ' + kl + '">' + n + '</span>';
}

// ── MODAL ─────────────────────────────────────────────────
function aabneModal(celleRef, label, nuvaerende) {
  aktivCelleRef = celleRef;
  document.getElementById("modal-titel").textContent = "Rediger: " + label;
  document.getElementById("modal-tekst").value = nuvaerende.replace(/\\n/g, "\n");
  document.getElementById("modal").classList.add("aktiv");
  setTimeout(() => document.getElementById("modal-tekst").focus(), 100);
}
function skjulModal() {
  document.getElementById("modal").classList.remove("aktiv");
  aktivCelleRef = null;
}
function lukkModal(e) { if (e.target === document.getElementById("modal")) skjulModal(); }
function gemFelt() {
  if (!aktivCelleRef || !aktivSheetId) return;
  var nyTekst = document.getElementById("modal-tekst").value;
  var gemKnap = document.querySelector(".modal-gem");
  var tabAtBevare = aktivTab;
  gemKnap.textContent = "Gemmer...";
  gemKnap.disabled = true;
  fetch(API_URL + "?handling=gem&id=" + encodeURIComponent(aktivSheetId) +
    "&celle=" + encodeURIComponent(aktivCelleRef) +
    "&vaerdi=" + encodeURIComponent(nyTekst))
    .then(r => r.json())
    .then(data => {
      if (data.fejl) throw new Error(data.fejl);
      skjulModal();
      hentRytterData(aktivSheetId, tabAtBevare);
    })
    .catch(err => alert("Kunne ikke gemme: " + err.message))
    .finally(() => { gemKnap.textContent = "Gem i Google Sheet"; gemKnap.disabled = false; });
}

// ── LISTE ─────────────────────────────────────────────────
function visRytterliste(ryttere) {
  var el = document.getElementById("liste-indhold");
  if (!ryttere || ryttere.length === 0) {
    el.innerHTML = '<div class="ingen-ryttere">Ingen ryttere fundet.</div>'; return;
  }
  var html = '<div class="soeg-wrapper"><input class="soeg-felt" type="search" placeholder="Søg rytter..." oninput="soegRyttere(this.value)"></div>' +
    '<div style="font-size:12px;font-weight:600;color:var(--tekst2);text-transform:uppercase;letter-spacing:0.06em;padding:8px 16px 6px;">Hold (' + ryttere.length + ' ryttere)</div>' +
    '<div class="rytter-liste" id="rytter-liste-items">';
  ryttere.forEach(r => { html += rytterKortHtml(r); });
  html += '</div>';
  el.innerHTML = html;
}
function rytterKortHtml(r) {
  var cpVis   = r.cp   ? formatCpHel(r.cp)   : "";
  var cpKgVis = r.cpKg ? formatCpKg(r.cpKg)  : "";
  var cpTekst = cpVis  ? cpVis + " W · " + cpKgVis + " W/kg" : "Ingen data endnu";
  return '<div class="rytter-kort" onclick="hentRytterData(\'' + r.id + '\')">' +
    '<div class="avatar">' + hentInitialer(r.navn) + '</div>' +
    '<div class="rytter-info"><div class="rytter-navn">' + r.navn + '</div>' +
    '<div class="rytter-sub">' + cpTekst + (r.phenotype ? ' · ' + r.phenotype : '') + '</div></div>' +
    '<div class="rytter-meta">' + niveauBadge(r.niveau) + '</div>' +
    '<div class="chevron">›</div></div>';
}
function soegRyttere(s) {
  var lower = s.toLowerCase();
  var c = document.getElementById("rytter-liste-items");
  if (c) c.innerHTML = rytterListe.filter(r => r.navn.toLowerCase().includes(lower)).map(rytterKortHtml).join("");
}

// ── HJÆLPERE ──────────────────────────────────────────────
function hentInitialer(navn) {
  if (!navn) return "?";
  var d = navn.trim().split(/\s+/);
  return d.length >= 2 ? (d[0][0] + d[d.length-1][0]).toUpperCase() : navn.substring(0,2).toUpperCase();
}
function formatCpKg(val) {
  if (!val) return "";
  var n = parseFloat(String(val).replace(",","."));
  return isNaN(n) ? val : n.toFixed(2);
}
// CP uden decimaler
function formatCpHel(val) {
  if (!val) return "";
  var n = parseFloat(String(val).replace(",","."));
  return isNaN(n) ? val : Math.round(n).toString();
}
// W' kommer nu formateret fra Apps Script fx "11.057" – vis direkte
function formatWPrim(val) {
  if (!val) return "";
  return String(val).trim();
}
</script>
